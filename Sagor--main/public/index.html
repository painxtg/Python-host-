<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f1a" />
  <title>Sagor Panel • Compact</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    :root {
      --bg-deep: #080e18;
      --bg-panel: #0f1726;
      --border: rgba(255, 255, 255, 0.08);
      --text: #eef5ff;
      --muted: #95a9c9;
      --pri: #5b9cf5;
      --ok: #34d399;
      --warn: #fbbf24;
      --bad: #f87171;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-pill: 40px;
      --tap-min: 42px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      background: radial-gradient(circle at 20% 10%, rgba(70, 130, 250, 0.12), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(52, 211, 153, 0.08), transparent 40%),
        var(--bg-deep);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      padding: 8px;
      margin: 0;
    }
    .app-shell {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    /* glass card */
    .card {
      background: rgba(18, 28, 48, 0.8);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #3b82f6, #10b981);
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 1.2rem;
    }
    .title h2 {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .title span {
      font-size: 0.75rem;
      color: var(--muted);
      display: block;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fbbf24;
    }
    .dot.ok {
      background: #34d399;
      box-shadow: 0 0 8px #34d399;
    }
    .chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 4px 0 8px;
    }
    .chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .chip i {
      font-size: 0.7rem;
    }
    .action-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin: 4px 0 10px;
    }
    .search-wrapper {
      flex: 2;
      min-width: 170px;
    }
    .search-wrapper input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 10px 15px;
      color: white;
      font-size: 0.9rem;
      outline: none;
    }
    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.2s;
      white-space: nowrap;
      min-height: var(--tap-min);
    }
    .btn-primary {
      background: #2563eb;
      border-color: #3b82f6;
      color: white;
      font-weight: 700;
    }
    .btn-small {
      padding: 6px 14px;
      font-size: 0.8rem;
    }
    .bots-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 4px;
      max-height: 55vh;
      overflow-y: auto;
      padding-right: 2px;
    }
    .bot-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      padding: 14px;
      transition: all 0.2s;
    }
    .bot-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .bot-name {
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .run-badge {
      font-size: 0.7rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .run-badge.on {
      background: rgba(52, 211, 153, 0.15);
      color: #6ee7b7;
    }
    .run-badge.off {
      background: rgba(248, 113, 113, 0.18);
      color: #fca5a5;
    }
    .bot-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 8px 0 10px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .bot-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .log-preview {
      background: #020617;
      border-radius: 12px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.7rem;
      color: #93c5fd;
      max-height: 70px;
      overflow: hidden;
      margin-top: 8px;
      cursor: pointer;
      white-space: pre-wrap;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .login-card {
      background: rgba(15, 23, 38, 0.9);
      padding: 24px;
      margin-top: 20px;
    }
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 12px;
    }
    .modal-content {
      background: #101b2b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      overflow: auto;
      padding: 16px;
    }
    .flex-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    textarea {
      background: #0a101c;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      color: white;
      padding: 12px;
      font-family: monospace;
      width: 100%;
      min-height: 220px;
      margin: 8px 0;
    }
    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 16px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      background: #1e293b;
      padding: 10px 16px;
      border-radius: 30px;
      font-size: 0.8rem;
      border-left: 4px solid #38bdf8;
      backdrop-filter: blur(10px);
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="app-shell" id="appShell">
    <!-- dynamic content injected -->
  </div>
  <div id="modalContainer"></div>
  <div class="toast-container" id="toastBox"></div>

  <script>
    const API = window.location.origin;
    let authToken = sessionStorage.getItem('sagor_token') || '';
    let appsData = [];
    let fileState = { app: '', path: '', items: [] };

    function toast(msg, type = 'ok') {
      const box = document.getElementById('toastBox');
      const el = document.createElement('div');
      el.className = 'toast';
      el.style.borderColor = type === 'bad' ? '#f87171' : '#34d399';
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    function authHeaders() {
      return authToken ? { 'X-Auth-Token': authToken } : {};
    }

    async function apiFetch(url, method = 'POST', body = null) {
      const opts = { method, headers: { 'Content-Type': 'application/json', ...authHeaders() } };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(url, opts);
      if (res.status === 403) { logout(); throw new Error('session'); }
      return res.json();
    }

    function renderShell() {
      const shell = document.getElementById('appShell');
      if (!authToken) {
        shell.innerHTML = `
          <div class="card login-card">
            <h2 style="margin:0 0 10px">🔐 Master Password</h2>
            <input id="passInput" type="password" placeholder="Password" style="width:100%; background:#0f1a2b; border:1px solid #334155; padding:12px; border-radius:30px; color:white;" />
            <button class="btn btn-primary" style="margin-top:12px; width:100%" onclick="login()">Unlock</button>
          </div>`;
        return;
      }
      shell.innerHTML = `
        <div class="card">
          <div class="top-row">
            <div class="brand">
              <div class="logo-icon"><i class="fas fa-robot"></i></div>
              <div class="title"><h2>Sagor Panel</h2><span>compact dashboard</span></div>
            </div>
            <div class="status-badge" id="serverStatus"><span class="dot"></span> connecting</div>
          </div>
          <div class="chips-row" id="statsChips"></div>
          <div class="action-bar">
            <div class="search-wrapper"><input id="searchBots" placeholder="🔍 Search bots..." oninput="renderBots()" /></div>
            <button class="btn" onclick="document.getElementById('hiddenFileInput').click()"><i class="fas fa-cloud-upload-alt"></i> Deploy</button>
            <button class="btn" onclick="refreshAll()"><i class="fas fa-sync-alt"></i></button>
            <button class="btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
          </div>
          <input type="file" id="hiddenFileInput" hidden accept=".zip,.py" onchange="handleFileSelect(event)" />
          <div id="botsContainer" class="bots-list">loading...</div>
        </div>`;
    }

    async function refreshOverview() {
      try {
        const data = await apiFetch(`${API}/api/overview`);
        document.getElementById('serverStatus').innerHTML = `<span class="dot ok"></span> ${data.server_uptime || 'online'}`;
        document.getElementById('statsChips').innerHTML = `
          <div class="chip"><i class="fas fa-play-circle"></i> ${data.running_apps || 0} running</div>
          <div class="chip"><i class="fas fa-stop-circle"></i> ${(data.total_apps||0)-(data.running_apps||0)} stopped</div>
          <div class="chip"><i class="fas fa-memory"></i> ${data.memory?.percent || 0}% RAM</div>
          <div class="chip"><i class="fas fa-microchip"></i> ${data.cpu || 0}% CPU</div>`;
      } catch (e) { /* ignore */ }
    }

    async function fetchApps() {
      try {
        const data = await apiFetch(`${API}/my_apps`, 'POST', { token: authToken });
        appsData = data.apps || [];
      } catch (e) { appsData = []; }
      renderBots();
    }

    function renderBots() {
      const container = document.getElementById('botsContainer');
      if (!container) return;
      const query = (document.getElementById('searchBots')?.value || '').toLowerCase();
      const filtered = appsData.filter(a => a.name.toLowerCase().includes(query));
      if (!filtered.length) {
        container.innerHTML = '<div style="color:#94a3b8; padding:20px; text-align:center">No bots found.</div>';
        return;
      }
      container.innerHTML = filtered.map(bot => `
        <div class="bot-card">
          <div class="bot-header">
            <span class="bot-name"><i class="fas fa-cube"></i> ${escHtml(bot.name)}</span>
            <span class="run-badge ${bot.running ? 'on' : 'off'}">${bot.running ? 'RUNNING' : 'STOPPED'}</span>
          </div>
          <div class="bot-meta">
            <span>⬆ ${bot.uptime || '0s'}</span>
            <span>📁 ${bot.files_count || 0} files</span>
            <span>📊 ${bot.memory_mb || 0} MB</span>
          </div>
          <div class="bot-actions">
            <button class="btn btn-small" onclick="act('${escJs(bot.name)}','start')"><i class="fas fa-play"></i></button>
            <button class="btn btn-small" onclick="act('${escJs(bot.name)}','stop')"><i class="fas fa-stop"></i></button>
            <button class="btn btn-small" onclick="act('${escJs(bot.name)}','restart')"><i class="fas fa-redo-alt"></i></button>
            <button class="btn btn-small" onclick="openFileManager('${escJs(bot.name)}')"><i class="fas fa-folder-open"></i> Files</button>
            <button class="btn btn-small" onclick="act('${escJs(bot.name)}','delete')"><i class="fas fa-trash"></i></button>
          </div>
          <div class="log-preview" onclick="openFileManager('${escJs(bot.name)}')">${escHtml(bot.logs || 'click for logs')}</div>
        </div>`).join('');
    }

    function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function escJs(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

    async function act(name, action) {
      if (action === 'delete' && !confirm(`Delete ${name}?`)) return;
      try {
        const res = await apiFetch(`${API}/action`, 'POST', { app_name: name, action });
        toast(res.message || action + ' done');
        await fetchApps();
      } catch (e) { toast('Action failed', 'bad'); }
    }

    function handleFileSelect(ev) {
      const file = ev.target.files[0];
      if (!file) return;
      uploadFile(file);
    }

    async function uploadFile(file) {
      const fd = new FormData();
      fd.append('file', file);
      try {
        const res = await fetch(`${API}/upload`, { method: 'POST', headers: authHeaders(), body: fd });
        const data = await res.json();
        toast(data.message || 'Deployed', 'ok');
        fetchApps();
      } catch (e) { toast('Upload failed', 'bad'); }
    }

    function openFileManager(appName) {
      fileState = { app: appName, path: '', items: [] };
      document.getElementById('modalContainer').innerHTML = `
        <div class="modal-mask" onclick="this.onclick=null; closeModal()">
          <div class="modal-content" onclick="event.stopPropagation()">
            <div class="flex-row" style="justify-content:space-between">
              <h3>📂 ${escHtml(appName)}</h3>
              <button class="btn btn-small" onclick="closeModal()">✕</button>
            </div>
            <div class="flex-row" style="margin:8px 0">
              <button class="btn btn-small" onclick="fileUp()">⬆ Up</button>
              <button class="btn btn-small" onclick="fileNew()">+File</button>
              <button class="btn btn-small" onclick="fileMkdir()">+Folder</button>
            </div>
            <div id="fileListArea" style="max-height:200px; overflow:auto">loading...</div>
            <input id="editFilePath" placeholder="filename.py" style="width:100%; margin-top:10px; background:#0f1a2b; border-radius:20px; padding:8px; color:white" />
            <textarea id="editContent" placeholder="file content..."></textarea>
            <button class="btn btn-primary" onclick="saveFile()">💾 Save</button>
          </div>
        </div>`;
      loadFileList();
    }

    async function loadFileList() {
      const area = document.getElementById('fileListArea');
      if (!area) return;
      try {
        const data = await apiFetch(`${API}/files/list`, 'POST', { token:authToken, app_name:fileState.app, path:fileState.path });
        fileState.items = data.items || [];
        area.innerHTML = fileState.items.map(i => `
          <div style="padding:6px; cursor:pointer; border-bottom:1px solid #1e293b" onclick="fileOpen('${escJs(i.path)}','${i.type}')">
            <i class="fas fa-${i.type==='dir'?'folder':'file'}"></i> ${escHtml(i.name)}
          </div>`).join('') || 'empty';
      } catch (e) { area.innerHTML = 'error'; }
    }

    async function fileOpen(path, type) {
      if (type === 'dir') { fileState.path = path; loadFileList(); return; }
      const data = await apiFetch(`${API}/files/read`, 'POST', { token:authToken, app_name:fileState.app, path });
      document.getElementById('editFilePath').value = path;
      document.getElementById('editContent').value = data.content || '';
    }

    function fileUp() {
      if (!fileState.path) return;
      const parts = fileState.path.split('/').filter(Boolean);
      parts.pop();
      fileState.path = parts.join('/');
      loadFileList();
    }
    function fileNew() { document.getElementById('editFilePath').value = ''; document.getElementById('editContent').value = ''; }
    async function fileMkdir() {
      const name = prompt('folder name');
      if (!name) return;
      await apiFetch(`${API}/files/mkdir`, 'POST', { token:authToken, app_name:fileState.app, path:name });
      loadFileList();
    }
    async function saveFile() {
      const path = document.getElementById('editFilePath').value.trim();
      const content = document.getElementById('editContent').value;
      if (!path) return toast('path missing', 'bad');
      await apiFetch(`${API}/files/write`, 'POST', { token:authToken, app_name:fileState.app, path, content });
      toast('saved');
      loadFileList();
    }

    function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }

    async function login() {
      const pw = document.getElementById('passInput')?.value;
      if (!pw) return;
      const res = await fetch(`${API}/auth`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pw}) });
      const data = await res.json();
      if (res.ok) {
        authToken = data.token;
        sessionStorage.setItem('sagor_token', authToken);
        renderShell();
        refreshAll();
      } else toast(data.message || 'wrong', 'bad');
    }

    function logout() {
      authToken = '';
      sessionStorage.removeItem('sagor_token');
      renderShell();
    }

    async function refreshAll() {
      if (!authToken) return;
      await refreshOverview();
      await fetchApps();
    }

    window.onload = () => {
      renderShell();
      if (authToken) refreshAll();
      setInterval(() => { if (authToken) refreshAll(); }, 12000);
    };
  </script>
</body>
  </html>
